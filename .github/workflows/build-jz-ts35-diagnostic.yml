name: JZ-TS35 STM32F207 SDIO 4-bit read-only diagnostic build

on:
  push:
    branches:
      - stage2c/gpio-readonly-baseline
      - stage2d/ili9486l-bringup
      - stage2d1/ili9486l-wiring-corrected
      - port/marlin-touch-jz-ts35
  workflow_dispatch:

concurrency:
  group: jz-ts35-touch-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain (bounded)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Compile STM32F207 ILI9486L + XPT2046 SPI mode-0 polling diagnostic
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR=".build/jz-ts35-sdio"
          mkdir -p "$BUILD_DIR"

          CPU_FLAGS="-mcpu=cortex-m3 -mthumb -mfloat-abi=soft"
          DEFINES="-DSTM32F207xx -D_VARIANTS_H_"
          INCLUDES="-ITFT/src/Libraries/cmsis/Core-CM3 -ITFT/src/Libraries/cmsis/stm32f2xx -ITFT/src/User"
          CFLAGS="$CPU_FLAGS $DEFINES $INCLUDES -std=gnu11 -O0 -g3 -ffunction-sections -fdata-sections -fno-common -fno-builtin -fno-unwind-tables -fno-asynchronous-unwind-tables -Wall -Wextra"

          arm-none-eabi-gcc $CPU_FLAGS -x assembler-with-cpp -c \
            TFT/src/Libraries/Startup/stm32f2xx/startup_stm32f2xx.s \
            -o "$BUILD_DIR/startup.o"

          arm-none-eabi-gcc $CFLAGS -c \
            TFT/diag/main.c \
            -o "$BUILD_DIR/diag_main.o"

          arm-none-eabi-gcc $CPU_FLAGS -nostdlib \
            -Wl,--gc-sections \
            -Wl,--build-id=none \
            -Wl,-Map="$BUILD_DIR/JZ-TS35-STM32F207-SDIO-DIAGNOSTIC.map" \
            -T buildroot/ldscripts/jz_ts35_v2_1_diag.ld \
            "$BUILD_DIR/startup.o" \
            "$BUILD_DIR/diag_main.o" \
            -Wl,--start-group -lgcc -Wl,--end-group \
            -o "$BUILD_DIR/JZ-TS35-STM32F207-SDIO-DIAGNOSTIC.elf"

          arm-none-eabi-objcopy -O ihex \
            "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.elf" "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.hex"
          arm-none-eabi-objcopy -O binary \
            "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.elf" "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.bin"
          arm-none-eabi-nm -n \
            "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.elf" > "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.symbols.txt"
          arm-none-eabi-objdump -h \
            "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.elf" > "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.sections.txt"

          echo "=== STM32 full-screen touch diagnostic symbols ==="
          grep -E 'g_stage2d_status|g_ms|SysTick_Handler|Reset_Handler| main$' \
            "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.symbols.txt"
          echo "=== ELF size ==="
          arm-none-eabi-size "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.elf"
          echo "=== ELF sections ==="
          cat "$BUILD_DIR/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.sections.txt"

      - name: Upload STM32F207 SDIO read-only diagnostic firmware and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC
          if-no-files-found: error
          path: |
            .build/jz-ts35-usart3-tx/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.elf
            .build/jz-ts35-usart3-tx/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.hex
            .build/jz-ts35-usart3-tx/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.bin
            .build/jz-ts35-usart3-tx/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.map
            .build/jz-ts35-usart3-tx/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.symbols.txt
            .build/jz-ts35-usart3-tx/JZ-TS35-STM32F207-TOUCH-DIAGNOSTIC.sections.txt
