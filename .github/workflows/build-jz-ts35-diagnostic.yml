name: JZ-TS35 Stage 2D ILI9486L bring-up

on:
  push:
    branches:
      - stage2c/gpio-readonly-baseline
      - stage2d/ili9486l-bringup
      - stage2d1/ili9486l-wiring-corrected
  workflow_dispatch:

concurrency:
  group: jz-ts35-stage2d-ili9486l
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Compile standalone STM32F207 Stage 2D ILI9486L firmware
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR=".build/jz-ts35-stage2d"
          mkdir -p "$BUILD_DIR"

          CPU_FLAGS="-mcpu=cortex-m3 -mthumb -mfloat-abi=soft"
          DEFINES="-DSTM32F207xx -D_VARIANTS_H_"
          INCLUDES="-ITFT/src/Libraries/cmsis/Core-CM3 -ITFT/src/Libraries/cmsis/stm32f2xx -ITFT/src/User"
          CFLAGS="$CPU_FLAGS $DEFINES $INCLUDES -std=gnu11 -O0 -g3 -ffunction-sections -fdata-sections -fno-common -fno-builtin -fno-unwind-tables -fno-asynchronous-unwind-tables -Wall -Wextra"

          arm-none-eabi-gcc $CPU_FLAGS -x assembler-with-cpp -c \
            TFT/src/Libraries/Startup/stm32f2xx/startup_stm32f2xx.s \
            -o "$BUILD_DIR/startup.o"

          arm-none-eabi-gcc $CFLAGS -c \
            TFT/diag/main.c \
            -o "$BUILD_DIR/diag_main.o"

          arm-none-eabi-gcc $CPU_FLAGS -nostdlib \
            -Wl,--gc-sections \
            -Wl,--build-id=none \
            -Wl,-Map="$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.map" \
            -T buildroot/ldscripts/jz_ts35_v2_1_diag.ld \
            "$BUILD_DIR/startup.o" \
            "$BUILD_DIR/diag_main.o" \
            -Wl,--start-group -lgcc -Wl,--end-group \
            -o "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.elf"

          arm-none-eabi-objcopy -O ihex \
            "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.elf" "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.hex"
          arm-none-eabi-objcopy -O binary \
            "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.elf" "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.bin"
          arm-none-eabi-nm -n \
            "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.elf" > "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.symbols.txt"
          arm-none-eabi-objdump -h \
            "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.elf" > "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.sections.txt"

          echo "=== Stage 2D symbols ==="
          grep -E 'g_stage2d_status|g_pixels_written|SysTick_Handler|Reset_Handler| main$' \
            "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.symbols.txt"
          echo "=== ELF size ==="
          arm-none-eabi-size "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.elf"
          echo "=== ELF sections ==="
          cat "$BUILD_DIR/JZ-TS35-STAGE2D-ILI9486L.sections.txt"

      - name: Upload Stage 2D firmware and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: JZ-TS35-STM32F207-STAGE2D-ILI9486L
          if-no-files-found: error
          path: |
            .build/jz-ts35-stage2d/JZ-TS35-STAGE2D-ILI9486L.elf
            .build/jz-ts35-stage2d/JZ-TS35-STAGE2D-ILI9486L.hex
            .build/jz-ts35-stage2d/JZ-TS35-STAGE2D-ILI9486L.bin
            .build/jz-ts35-stage2d/JZ-TS35-STAGE2D-ILI9486L.map
            .build/jz-ts35-stage2d/JZ-TS35-STAGE2D-ILI9486L.symbols.txt
            .build/jz-ts35-stage2d/JZ-TS35-STAGE2D-ILI9486L.sections.txt
