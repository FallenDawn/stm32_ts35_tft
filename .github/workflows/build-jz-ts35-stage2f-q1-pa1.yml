name: JZ-TS35 Stage 2F Q1 PA1 backlight test

on:
  push:
    branches:
      - stage2f/q1-pa1-backlight-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Compile Q1 PA1 diagnostic firmware
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".build/jz-ts35-stage2f"
          mkdir -p "$BUILD_DIR"
          CPU_FLAGS="-mcpu=cortex-m3 -mthumb -mfloat-abi=soft"
          DEFINES="-DSTM32F207xx -D_VARIANTS_H_ -DJZ_Q1_ACTIVE_LEVEL=1"
          INCLUDES="-ITFT/src/Libraries/cmsis/Core-CM3 -ITFT/src/Libraries/cmsis/stm32f2xx -ITFT/src/User"
          CFLAGS="$CPU_FLAGS $DEFINES $INCLUDES -std=gnu11 -O0 -g3 -ffunction-sections -fdata-sections -fno-common -fno-builtin -fno-unwind-tables -fno-asynchronous-unwind-tables -Wall -Wextra"
          arm-none-eabi-gcc $CPU_FLAGS -x assembler-with-cpp -c TFT/src/Libraries/Startup/stm32f2xx/startup_stm32f2xx.s -o "$BUILD_DIR/startup.o"
          arm-none-eabi-gcc $CFLAGS -c TFT/diag/orientation_pattern.c -o "$BUILD_DIR/orientation_pattern.o"
          arm-none-eabi-gcc $CPU_FLAGS -nostdlib -Wl,--gc-sections -Wl,--build-id=none -Wl,-Map="$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.map" -T buildroot/ldscripts/jz_ts35_v2_1_diag.ld "$BUILD_DIR/startup.o" "$BUILD_DIR/orientation_pattern.o" -Wl,--start-group -lgcc -Wl,--end-group -o "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.elf"
          arm-none-eabi-objcopy -O ihex "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.elf" "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.hex"
          arm-none-eabi-objcopy -O binary "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.elf" "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.bin"
          arm-none-eabi-nm -n "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.elf" > "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.symbols.txt"
          arm-none-eabi-size "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.elf"
          grep -E 'g_stage_status|g_pixels_written|g_heartbeat|g_sd_status|g_sd_type|g_sd_r1|g_sd_token|g_sd_checksum| main$' "$BUILD_DIR/JZ-TS35-STAGE2F-Q1-PA1.symbols.txt"

      - name: Upload firmware and symbols
        uses: actions/upload-artifact@v4
        with:
          name: JZ-TS35-STM32F207-STAGE2F-Q1-PA1
          if-no-files-found: error
          path: |
            .build/jz-ts35-stage2f/JZ-TS35-STAGE2F-Q1-PA1.elf
            .build/jz-ts35-stage2f/JZ-TS35-STAGE2F-Q1-PA1.hex
            .build/jz-ts35-stage2f/JZ-TS35-STAGE2F-Q1-PA1.bin
            .build/jz-ts35-stage2f/JZ-TS35-STAGE2F-Q1-PA1.map
            .build/jz-ts35-stage2f/JZ-TS35-STAGE2F-Q1-PA1.symbols.txt
