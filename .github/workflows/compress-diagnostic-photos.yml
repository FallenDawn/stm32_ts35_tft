name: Compress diagnostic photos

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/compress-diagnostic-photos.yml

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Convert original JPGs to optimized WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          names = [
              "2efcfa4ca18db738ae7c7201ca6df217.jpg",
              "55a60b1062d21766b85a343a6bc1b587.jpg",
              "6d45a6b3df18c300fdb1087b62c1f805.jpg",
              "7f24b73374fc3a84a6b8466bd49d32cf.jpg",
          ]

          out = Path("diagnostics/compressed")
          out.mkdir(parents=True, exist_ok=True)

          for name in names:
              src = Path(name)
              if not src.is_file():
                  raise SystemExit(f"Missing source image: {src}")
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  im.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
                  dst = out / (src.stem + ".webp")
                  im.save(dst, "WEBP", quality=78, method=6)
                  print(f"{src}: {src.stat().st_size} bytes -> {dst}: {dst.stat().st_size} bytes")
          PY

      - name: Commit compressed copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/compressed/*.webp
          if git diff --cached --quiet; then
            echo "No compressed images were produced."
            exit 1
          fi
          git commit -m "Add compressed diagnostic photo copies"
          git push
