name: JZ-TS35 Stage 2D.3 orientation offset pattern

on:
  push:
    branches:
      - stage2d3/orientation-offset-pattern
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pattern:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Compile diagnostic firmware
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".build/jz-ts35-stage2d3"
          mkdir -p "$BUILD_DIR"
          CPU_FLAGS="-mcpu=cortex-m3 -mthumb -mfloat-abi=soft"
          DEFINES="-DSTM32F207xx -D_VARIANTS_H_"
          INCLUDES="-ITFT/src/Libraries/cmsis/Core-CM3 -ITFT/src/Libraries/cmsis/stm32f2xx -ITFT/src/User"
          CFLAGS="$CPU_FLAGS $DEFINES $INCLUDES -std=gnu11 -O0 -g3 -ffunction-sections -fdata-sections -fno-common -fno-builtin -fno-unwind-tables -fno-asynchronous-unwind-tables -Wall -Wextra"
          arm-none-eabi-gcc $CPU_FLAGS -x assembler-with-cpp -c TFT/src/Libraries/Startup/stm32f2xx/startup_stm32f2xx.s -o "$BUILD_DIR/startup.o"
          arm-none-eabi-gcc $CFLAGS -c TFT/diag/orientation_pattern.c -o "$BUILD_DIR/orientation_pattern.o"
          arm-none-eabi-gcc $CPU_FLAGS -nostdlib -Wl,--gc-sections -Wl,--build-id=none -Wl,-Map="$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.map" -T buildroot/ldscripts/jz_ts35_v2_1_diag.ld "$BUILD_DIR/startup.o" "$BUILD_DIR/orientation_pattern.o" -Wl,--start-group -lgcc -Wl,--end-group -o "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.elf"
          arm-none-eabi-objcopy -O ihex "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.elf" "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.hex"
          arm-none-eabi-objcopy -O binary "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.elf" "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.bin"
          arm-none-eabi-nm -n "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.elf" > "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.symbols.txt"
          arm-none-eabi-size "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.elf"
          grep -E 'g_stage_status|g_pixels_written|g_heartbeat| main$' "$BUILD_DIR/JZ-TS35-STAGE2D3-ORIENTATION.symbols.txt"
      - name: Upload firmware and symbols
        uses: actions/upload-artifact@v4
        with:
          name: JZ-TS35-STM32F207-STAGE2D3-ORIENTATION
          if-no-files-found: error
          path: |
            .build/jz-ts35-stage2d3/JZ-TS35-STAGE2D3-ORIENTATION.elf
            .build/jz-ts35-stage2d3/JZ-TS35-STAGE2D3-ORIENTATION.hex
            .build/jz-ts35-stage2d3/JZ-TS35-STAGE2D3-ORIENTATION.bin
            .build/jz-ts35-stage2d3/JZ-TS35-STAGE2D3-ORIENTATION.map
            .build/jz-ts35-stage2d3/JZ-TS35-STAGE2D3-ORIENTATION.symbols.txt
