name: JZ-TS35 V2.1 firmware build

on:
  push:
    branches:
      - port/jz-ts35-v2-1
      - port/marlin-touch-jz-ts35
  workflow_dispatch:

jobs:
  build-jz-ts35:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build STM32F207VCT6 + ILI9486L
        run: pio run -e JZ_TS35_V2_1
      - name: Generate Intel HEX
        shell: bash
        run: |
          elf="$(find .pio/build/JZ_TS35_V2_1 -maxdepth 1 -type f -name '*.elf' -print -quit)"
          test -n "$elf"
          objcopy="$(find "$HOME/.platformio/packages/toolchain-gccarmnoneeabi" -name arm-none-eabi-objcopy -print -quit)"
          test -x "$objcopy"
          "$objcopy" -O ihex "$elf" "${elf%.elf}.hex"
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JZ-TS35-V2.1-STM32F207VCT6-ILI9486L
          path: |
            .pio/build/JZ_TS35_V2_1/*.bin
            .pio/build/JZ_TS35_V2_1/*.hex
            .pio/build/JZ_TS35_V2_1/*.elf
